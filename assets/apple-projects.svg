<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" role="img" aria-labelledby="projTitle projDesc">
  <title id="projTitle">Proyectos en Producción &amp; Casos de Estudio</title>
  <desc id="projDesc">Soluciones desplegadas en producción institucional: SGI UNAH, Validador Criptográfico QR y Ponencia COMPDES 2026.</desc>
  <defs>
    <linearGradient id="pSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="pRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="980" height="340" rx="18" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.2"/>

  <!-- Header -->
  <text x="36" y="32" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" letter-spacing="0.8">SOLUCIONES EN PRODUCCIÓN // CASOS DE ESTUDIO</text>
  <text x="944" y="32" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500">DESPLEGADO · VALIDADO</text>
  <line x1="36" y1="44" x2="944" y2="44" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- ================= PROJECT 1: SGI UNAH ================= -->
  <g transform="translate(36, 60)">
    <rect width="908" height="78" rx="14" fill="url(#pSurface)" stroke="url(#pRim)" stroke-width="1"/>
    
    <!-- Left Indicator Strip -->
    <rect x="0" y="0" width="4" height="78" rx="2" fill="#38BDF8"/>

    <!-- Content -->
    <rect x="18" y="12" width="170" height="18" rx="9" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.3"/>
    <text x="103" y="25" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5">PRODUCCIÓN · SGI.UNAH.EDU.HN</text>

    <text x="18" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="600">
      SGI — Sistema de Gestión de la Investigación (UNAH)
    </text>
    <text x="18" y="66" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">
      Plataforma institucional tipo CRIS. Gestiona a <tspan fill="#38BDF8" font-weight="600">+1,630 investigadores</tspan> y <tspan fill="#38BDF8" font-weight="600">+1,220 proyectos activos</tspan> con reducción del 75% al 99% en tiempos de trámite.
    </text>

    <!-- Right Tags -->
    <g transform="translate(680, 26)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#94A3B8">
      <rect x="0" y="0" width="72" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="36" y="15" text-anchor="middle">Angular 18</text>

      <rect x="78" y="0" width="62" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="109" y="15" text-anchor="middle">Node.js</text>

      <rect x="146" y="0" width="76" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="184" y="15" text-anchor="middle">SQL Server</text>
    </g>
  </g>

  <!-- ================= PROJECT 2: VALIDADOR QR ================= -->
  <g transform="translate(36, 150)">
    <rect width="908" height="78" rx="14" fill="url(#pSurface)" stroke="url(#pRim)" stroke-width="1"/>
    
    <!-- Left Indicator Strip -->
    <rect x="0" y="0" width="4" height="78" rx="2" fill="#34D399"/>

    <!-- Content -->
    <rect x="18" y="12" width="180" height="18" rx="9" fill="#059669" fill-opacity="0.2" stroke="#34D399" stroke-opacity="0.3"/>
    <text x="108" y="25" text-anchor="middle" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5">SEGURIDAD &amp; INTEGRIDAD CRIPTO</text>

    <text x="18" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="600">
      Validador Institucional Criptográfico de Certificados QR
    </text>
    <text x="18" y="66" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">
      Motor de verificación pública en tiempo real con <tspan fill="#34D399" font-weight="600">+113 certificados emitidos</tspan> y firmas hash antifalsificación con respuesta en milisegundos.
    </text>

    <!-- Right Tags -->
    <g transform="translate(668, 26)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#94A3B8">
      <rect x="0" y="0" width="84" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="42" y="15" text-anchor="middle">Criptografía</text>

      <rect x="90" y="0" width="68" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="124" y="15" text-anchor="middle">SHA-256</text>

      <rect x="164" y="0" width="70" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="199" y="15" text-anchor="middle">Motor QR</text>
    </g>
  </g>

  <!-- ================= PROJECT 3: COMPDES 2026 ================= -->
  <g transform="translate(36, 240)">
    <rect width="908" height="78" rx="14" fill="url(#pSurface)" stroke="url(#pRim)" stroke-width="1"/>
    
    <!-- Left Indicator Strip -->
    <rect x="0" y="0" width="4" height="78" rx="2" fill="#A78BFA"/>

    <!-- Content -->
    <rect x="18" y="12" width="194" height="18" rx="9" fill="#7C3AED" fill-opacity="0.2" stroke="#A78BFA" stroke-opacity="0.3"/>
    <text x="115" y="25" text-anchor="middle" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5">CONFERENCIA · EL SALVADOR 2026</text>

    <text x="18" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="600">
      Ponencia Internacional COMPDES 2026 — Transformación Digital
    </text>
    <text x="18" y="66" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">
      Presentación sobre arquitectura modular en plataformas científicas de Ciencia Abierta bajo el marco metodológico ágil DBR/DSR.
    </text>

    <!-- Right Tags -->
    <g transform="translate(668, 26)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#94A3B8">
      <rect x="0" y="0" width="94" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="47" y="15" text-anchor="middle">Ciencia Abierta</text>

      <rect x="100" y="0" width="78" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="139" y="15" text-anchor="middle">DBR / DSR</text>

      <rect x="184" y="0" width="50" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="209" y="15" text-anchor="middle">Paper</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="960" height="170" role="img" aria-labelledby="princTitle princDesc">
  <title id="princTitle">Core Engineering Pillars · Luis Leonel Mejia Romero</title>
  <desc id="princDesc">Three foundational engineering principles: Zero-Trust Security, Production Scalability, and Clean Modular Architecture.</desc>
  <defs>
    <linearGradient id="pCardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="960" height="170" rx="14" fill="#0B0F19" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Card 1: Zero-Trust Security -->
  <g transform="translate(24, 20)">
    <rect width="288" height="130" rx="10" fill="url(#pCardBg)" stroke="#10B981" stroke-width="1.2"/>
    <rect x="0" y="0" width="288" height="3" rx="1.5" fill="#10B981"/>
    <!-- Icon Shield -->
    <circle cx="28" cy="32" r="14" fill="#064E3B"/>
    <path d="M28 24 L34 27 V33 C34 37 28 40 28 40 C28 40 22 37 22 33 V27 Z" fill="none" stroke="#34D399" stroke-width="1.6"/>
    <text x="52" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">Zero-Trust &amp; Criptografía</text>
    <text x="52" y="47" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">SEGURIDAD INSTITUCIONAL</text>

    <text x="20" y="80" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      Firmas criptográficas anti-falsificación QR, sesiones rolling con JWT y SQL 100% parametrizado.
    </text>
  </g>

  <!-- Card 2: Production Scalability -->
  <g transform="translate(336, 20)">
    <rect width="288" height="130" rx="10" fill="url(#pCardBg)" stroke="#38BDF8" stroke-width="1.2"/>
    <rect x="0" y="0" width="288" height="3" rx="1.5" fill="#38BDF8"/>
    <!-- Icon Scale / Lightning -->
    <circle cx="28" cy="32" r="14" fill="#0C4A6E"/>
    <path d="M28 23 L24 32 H30 L27 41 L34 30 H28 Z" fill="none" stroke="#38BDF8" stroke-width="1.6"/>
    <text x="52" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">Escalabilidad de Misión Crítica</text>
    <text x="52" y="47" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">+1,630 USUARIOS ACTIVOS</text>

    <text x="20" y="80" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      Diseñado para alta concurrencia transaccional, reducción de hasta 99% en tiempos de respuesta y cero caídas.
    </text>
  </g>

  <!-- Card 3: Modular Clean Architecture -->
  <g transform="translate(648, 20)">
    <rect width="288" height="130" rx="10" fill="url(#pCardBg)" stroke="#A78BFA" stroke-width="1.2"/>
    <rect x="0" y="0" width="288" height="3" rx="1.5" fill="#A78BFA"/>
    <!-- Icon Code / Module -->
    <circle cx="28" cy="32" r="14" fill="#4C1D95"/>
    <rect x="23" y="27" width="10" height="10" rx="2" fill="none" stroke="#C4B5FD" stroke-width="1.6"/>
    <line x1="28" y1="23" x2="28" y2="27" stroke="#C4B5FD" stroke-width="1.4"/>
    <line x1="28" y1="37" x2="28" y2="41" stroke="#C4B5FD" stroke-width="1.4"/>
    <text x="52" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">Arquitectura Modular &amp; DSR</text>
    <text x="52" y="47" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">PONENCIA COMPDES 2026</text>

    <text x="20" y="80" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      Código desacoplado, metodologías ágiles de Ciencia Abierta y reactividad pura con Angular Signals.
    </text>
  </g>
</svg>

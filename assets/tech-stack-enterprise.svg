<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="techTitle techDesc">
  <title id="techTitle">Enterprise Technology Matrix · Luis Leonel Mejia Romero</title>
  <desc id="techDesc">Categorized enterprise technology stack across Frontend, Backend, Databases, and Cloud/Security tiers.</desc>
  <defs>

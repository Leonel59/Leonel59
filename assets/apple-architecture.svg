<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 290" width="980" height="290" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Arquitectura de Sistemas · Pipeline de Producción</title>
  <desc id="archDesc">Diagrama de cuatro capas desacopladas con diseño de vidrio translúcido estilo macOS y pulsos de datos animados.</desc>
  <defs>
    <!-- Glass Gradients -->
    <linearGradient id="boardSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.015"/>
    </linearGradient>

    <linearGradient id="boardRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="tierGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="tierRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Board Surface -->
  <rect width="980" height="290" rx="18" fill="url(#boardSurface)" stroke="url(#boardRim)" stroke-width="1.2"/>

  <!-- Subtitle Header -->
  <text x="36" y="34" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" letter-spacing="0.8">TOPOLOGÍA DE SISTEMAS // PIPELINE EN PRODUCCIÓN</text>
  <text x="944" y="34" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500">ALTA DISPONIBILIDAD · SGI CRIS</text>
  <line x1="36" y1="46" x2="944" y2="46" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Optical Conduits Connecting Modules -->
  <g stroke="#334155" stroke-width="1.8" stroke-dasharray="3 3">
    <line x1="236" y1="160" x2="276" y2="160"/>
    <line x1="472" y1="160" x2="512" y2="160"/>
    <line x1="708" y1="160" x2="748" y2="160"/>
  </g>

  <!-- Animated Optical Light Pulses -->
  <circle cx="236" cy="160" r="3.5" fill="#38BDF8" filter="url(#softGlow)">
    <animate attributeName="cx" values="236;276" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="472" cy="160" r="3.5" fill="#34D399" filter="url(#softGlow)">
    <animate attributeName="cx" values="472;512" dur="2s" begin="0.65s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;1;0.1" dur="2s" begin="0.65s" repeatCount="indefinite"/>
  </circle>

  <circle cx="708" cy="160" r="3.5" fill="#A78BFA" filter="url(#softGlow)">
    <animate attributeName="cx" values="708;748" dur="2s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;1;0.1" dur="2s" begin="1.3s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= TIER 01: CLIENTE ================= -->
  <g transform="translate(36, 68)">
    <rect width="200" height="196" rx="14" fill="url(#tierGlass)" stroke="url(#tierRim)" stroke-width="1"/>
    <text x="18" y="26" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">CAPA 01 · CLIENTE</text>
    <text x="18" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="600">Frontend Reactivo</text>
    <line x1="18" y1="60" x2="182" y2="60" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#94A3B8">
      <text x="18" y="86">Angular 18 (Signals)</text>
      <text x="18" y="108">Flujo Reactivo RxJS</text>
      <text x="18" y="130">PrimeNG &amp; Material</text>
      <text x="18" y="152">Capacitor (Android/iOS)</text>
      <text x="18" y="174">Arquitectura PWA / SSR</text>
    </g>
  </g>

  <!-- ================= TIER 02: GATEWAY ================= -->
  <g transform="translate(272, 68)">
    <rect width="200" height="196" rx="14" fill="url(#tierGlass)" stroke="url(#tierRim)" stroke-width="1"/>
    <text x="18" y="26" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">CAPA 02 · SEGURIDAD</text>
    <text x="18" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="600">Gateway Cripto</text>
    <line x1="18" y1="60" x2="182" y2="60" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#94A3B8">
      <text x="18" y="86">Express API Gateway</text>
      <text x="18" y="108">Sesiones Rolling JWT</text>
      <text x="18" y="130">Motor Criptográfico QR</text>
      <text x="18" y="152">Hash Anti-Falsificación</text>
      <text x="18" y="174">Filtros OWASP Top 10</text>
    </g>
  </g>

  <!-- ================= TIER 03: SERVICIOS ================= -->
  <g transform="translate(508, 68)">
    <rect width="200" height="196" rx="14" fill="url(#tierGlass)" stroke="url(#tierRim)" stroke-width="1"/>
    <text x="18" y="26" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">CAPA 03 · DOMINIO</text>
    <text x="18" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="600">Servicios CRIS</text>
    <line x1="18" y1="60" x2="182" y2="60" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#94A3B8">
      <text x="18" y="86">Lógica Modular SGI</text>
      <text x="18" y="108">Gestión de Dictámenes</text>
      <text x="18" y="130">Notificaciones Push</text>
      <text x="18" y="152">Generador PDF Dinámico</text>
      <text x="18" y="174">Tareas en Segundo Plano</text>
    </g>
  </g>

  <!-- ================= TIER 04: DATOS ================= -->
  <g transform="translate(744, 68)">
    <rect width="200" height="196" rx="14" fill="url(#tierGlass)" stroke="url(#tierRim)" stroke-width="1"/>
    <text x="18" y="26" fill="#FB7185" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">CAPA 04 · PERSISTENCIA</text>
    <text x="18" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="600">Datos &amp; Nube</text>
    <line x1="18" y1="60" x2="182" y2="60" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#94A3B8">
      <text x="18" y="86">SQL Server (mssql)</text>
      <text x="18" y="108">Stored Procedures T-SQL</text>
      <text x="18" y="130">Consultas Parametrizadas</text>
      <text x="18" y="152">Almacenamiento AWS S3</text>
      <text x="18" y="174">Integración Azure MSAL</text>
    </g>
  </g>
</svg>

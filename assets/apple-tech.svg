  <text x="944" y="32" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500">PRODUCCIÓN · ALTA DISPONIBILIDAD</text>
  <line x1="36" y1="44" x2="944" y2="44" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- ================= BLOCK 1: FRONTEND ================= -->

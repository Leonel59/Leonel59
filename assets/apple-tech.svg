      <rect x="164" y="28" width="68" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="198" y="43" text-anchor="middle" fill="#F8FAFC">MySQL</text>

      <rect x="238" y="28" width="138" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="307" y="43" text-anchor="middle" fill="#F8FAFC">Transacciones ACID</text>
    </g>

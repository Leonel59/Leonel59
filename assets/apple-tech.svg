      <rect x="162" y="0" width="118" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="221" y="15" text-anchor="middle" fill="#F8FAFC">OWASP Security</text>

      <rect x="286" y="0" width="108" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="340" y="15" text-anchor="middle" fill="#F8FAFC">Azure (MSAL)</text>

      <!-- Row 2 -->
      <rect x="0" y="28" width="70" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="35" y="43" text-anchor="middle" fill="#F8FAFC">Docker</text>

      <rect x="76" y="28" width="78" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="115" y="43" text-anchor="middle" fill="#F8FAFC">AWS S3</text>

      <rect x="160" y="28" width="112" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="216" y="43" text-anchor="middle" fill="#F8FAFC">GitLab CI/CD</text>

      <rect x="278" y="28" width="112" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="334" y="43" text-anchor="middle" fill="#F8FAFC">Jasmine/Karma</text>

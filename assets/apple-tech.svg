<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 290" width="980" height="290" role="img" aria-labelledby="techTitle techDesc">
  <title id="techTitle">Ecosistema Tecnológico · Herramientas en Producción</title>
  <desc id="techDesc">Cuatro áreas técnicas clave con diseño minimalista de vidrio translúcido estilo Apple.</desc>
  <defs>
    <linearGradient id="tSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.015"/>
    </linearGradient>
    <linearGradient id="tRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->

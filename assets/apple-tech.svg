    <text x="18" y="24" fill="#FB7185" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="700" letter-spacing="0.6">CLOUD, SEGURIDAD &amp; CALIDAD</text>
    
    <g transform="translate(18, 38)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="500">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Luis Leonel Mejia Romero · Systems Architect &amp; Lead Full Stack Engineer</title>
  <desc id="heroDesc">Executive systems cockpit header showcasing enterprise production metrics and core engineering specialization.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Metallic/Glow Gradients -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="420" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Architectural Grid Background -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="0.8">
    <line x1="0" y1="70" x2="1000" y2="70"/>
    <line x1="0" y1="140" x2="1000" y2="140"/>
    <line x1="0" y1="210" x2="1000" y2="210"/>
    <line x1="0" y1="280" x2="1000" y2="280"/>
    <line x1="0" y1="350" x2="1000" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="250" y1="0" x2="250" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="140" fill="#0284C7" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="850" cy="180" r="160" fill="#059669" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="998" height="418" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- ================= TOP STATUS BAR ================= -->
  <rect x="0" y="0" width="1000" height="48" rx="16" fill="#0A0F1D" opacity="0.8"/>
  <line x1="0" y1="48" x2="1000" y2="48" stroke="#1E293B" stroke-width="1"/>

  <!-- Status Indicator Pulse -->
  <g transform="translate(36, 24)">
    <circle cx="0" cy="0" r="4.5" fill="#10B981"/>
    <circle cx="0" cy="0" r="4.5" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="4.5;13" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="52" y="28" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">SYSTEM PRODUCTION ONLINE</text>

  <!-- Central Target Platform -->
  <text x="500" y="28" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">
    CORE ARCHITECTURE // <tspan fill="#38BDF8" font-weight="600">SGI.UNAH.EDU.HN</tspan>
  </text>

  <!-- Geolocation Tag -->
  <text x="964" y="28" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">
    TEGUCIGALPA, HN · UTC-6
  </text>

  <!-- ================= HERO HEADLINE & IDENTITY ================= -->
  <!-- Kicker Tag -->
  <g transform="translate(48, 86)">
    <rect width="186" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="93" y="17" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">FULL STACK ARCHITECT</text>
  </g>

  <!-- Main Name -->
  <text x="48" y="152" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.8">
    Luis Leonel Mejía Romero
  </text>

  <!-- Subtitle Role -->
  <text x="48" y="186" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="0.2">
    Lead Full Stack Engineer · Co-Creator of SGI-UNAH · Lic. en Informática Administrativa
  </text>

  <!-- Statement -->
  <text x="48" y="214" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
    Especializado en plataformas CRIS de alta concurrencia, arquitecturas modulares y motores de seguridad criptográfica.
  </text>

  <!-- Horizontal Divider -->
  <line x1="48" y1="240" x2="952" y2="240" stroke="#1E293B" stroke-width="1"/>

  <!-- ================= 4 ARCHITECTURAL KPI CARDS ================= -->
  <!-- CARD 1: Investigadores Activos -->
  <g transform="translate(48, 258)">
    <rect width="210" height="132" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="210" height="3" rx="1.5" fill="#38BDF8"/>
    <text x="20" y="42" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">+1,630</text>
    <text x="20" y="70" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Investigadores Activos</text>
    <text x="20" y="92" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Comunidad científica nacional en plataforma CRIS oficial</text>
  </g>

  <!-- CARD 2: Proyectos Científicos -->
  <g transform="translate(282, 258)">
    <rect width="210" height="132" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="210" height="3" rx="1.5" fill="#34D399"/>
    <text x="20" y="42" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">+1,220</text>
    <text x="20" y="70" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Proyectos Científicos</text>
    <text x="20" y="92" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Gestión de dictámenes, avances y publicaciones</text>
  </g>

  <!-- CARD 3: Optimización Operativa -->
  <g transform="translate(516, 258)">
    <rect width="210" height="132" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="210" height="3" rx="1.5" fill="#A78BFA"/>
    <text x="20" y="42" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">75% - 99%</text>
    <text x="20" y="70" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Ahorro en Tiempos</text>
    <text x="20" y="92" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Reducción en dictámenes y certificaciones oficiales</text>
  </g>

  <!-- CARD 4: Seguridad & Validador QR -->
  <g transform="translate(750, 258)">
    <rect width="202" height="132" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="202" height="3" rx="1.5" fill="#F43F5E"/>
    <text x="20" y="42" fill="#FB7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">+113</text>
    <text x="20" y="70" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Certificados Hash QR</text>
    <text x="20" y="92" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Firmas digitales emitidas con validación en ms</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="diagTitle diagDesc">
  <title id="diagTitle">Production Architecture Flow · SGI CRIS &amp; Enterprise Full Stack</title>
  <desc id="diagDesc">Enterprise system diagram illustrating client tier, cryptographic gateway, domain services, and SQL Server persistence.</desc>
  <defs>
    <linearGradient id="boxBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="packetGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="960" height="300" rx="14" fill="#0B0F19" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Diagram Header -->
  <text x="36" y="36" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">SYSTEM TOPOLOGY // PRODUCTION ARCHITECTURE PIPELINE</text>
  <text x="924" y="36" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">ACID COMPLIANT · HIGH AVAILABILITY</text>
  <line x1="36" y1="50" x2="924" y2="50" stroke="#1E293B" stroke-width="1"/>

  <!-- Main Connecting Bus Lines -->
  <g stroke="#334155" stroke-width="2" stroke-dasharray="4 4">
    <line x1="228" y1="160" x2="276" y2="160"/>
    <line x1="456" y1="160" x2="504" y2="160"/>
    <line x1="684" y1="160" x2="732" y2="160"/>
  </g>

  <!-- Animated Data Packets Traveling on Bus Lines -->
  <!-- Packet 1: Tier 1 to 2 -->
  <circle cx="228" cy="160" r="3.5" fill="#38BDF8" filter="url(#packetGlow)">
    <animate attributeName="cx" values="228;276" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Packet 2: Tier 2 to 3 -->
  <circle cx="456" cy="160" r="3.5" fill="#10B981" filter="url(#packetGlow)">
    <animate attributeName="cx" values="456;504" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Packet 3: Tier 3 to 4 -->
  <circle cx="684" cy="160" r="3.5" fill="#A78BFA" filter="url(#packetGlow)">
    <animate attributeName="cx" values="684;732" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= TIER 1: CLIENT APPLICATION ================= -->
  <g transform="translate(36, 76)">
    <rect width="192" height="196" rx="10" fill="url(#boxBg)" stroke="#38BDF8" stroke-width="1.3"/>
    <rect x="0" y="0" width="192" height="4" rx="2" fill="#38BDF8"/>
    <text x="18" y="28" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">TIER 01 // CLIENT</text>
    <text x="18" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Reactive Frontend</text>
    
    <path d="M18 64H174" stroke="#1E293B"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#94A3B8">
      <text x="18" y="88">✦ Angular 18 (Signals)</text>
      <text x="18" y="110">✦ RxJS State Pipeline</text>
      <text x="18" y="132">✦ PrimeNG &amp; Material</text>
      <text x="18" y="154">✦ PWA / SSR Ready</text>
      <text x="18" y="176">✦ Capacitor (Android)</text>
    </g>
  </g>

  <!-- ================= TIER 2: GATEWAY & SECURITY ================= -->
  <g transform="translate(264, 76)">
    <rect width="192" height="196" rx="10" fill="url(#boxBg)" stroke="#10B981" stroke-width="1.3"/>
    <rect x="0" y="0" width="192" height="4" rx="2" fill="#10B981"/>
    <text x="18" y="28" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">TIER 02 // SECURITY</text>
    <text x="18" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Gateway &amp; Crypto</text>
    
    <path d="M18 64H174" stroke="#1E293B"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#94A3B8">
      <text x="18" y="88">✦ Express API Gateway</text>
      <text x="18" y="110">✦ JWT Rolling Sessions</text>
      <text x="18" y="132">✦ QR Cryptographic Engine</text>
      <text x="18" y="154">✦ Anti-Tamper Hashes</text>
      <text x="18" y="176">✦ OWASP Top 10 Defense</text>
    </g>
  </g>

  <!-- ================= TIER 3: DOMAIN LOGIC ================= -->
  <g transform="translate(492, 76)">
    <rect width="192" height="196" rx="10" fill="url(#boxBg)" stroke="#A78BFA" stroke-width="1.3"/>
    <rect x="0" y="0" width="192" height="4" rx="2" fill="#A78BFA"/>
    <text x="18" y="28" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">TIER 03 // SERVICES</text>
    <text x="18" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Domain Services</text>
    
    <path d="M18 64H174" stroke="#1E293B"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#94A3B8">
      <text x="18" y="88">✦ SGI CRIS Core Logic</text>
      <text x="18" y="110">✦ Workflow Dictámenes</text>
      <text x="18" y="132">✦ Firebase Web Push</text>
      <text x="18" y="154">✦ Nodemailer Triggers</text>
      <text x="18" y="176">✦ Dynamic PDF Engine</text>
    </g>
  </g>

  <!-- ================= TIER 4: PERSISTENCE & STORAGE ================= -->
  <g transform="translate(720, 76)">
    <rect width="204" height="196" rx="10" fill="url(#boxBg)" stroke="#FB7185" stroke-width="1.3"/>
    <rect x="0" y="0" width="204" height="4" rx="2" fill="#FB7185"/>
    <text x="18" y="28" fill="#FB7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">TIER 04 // PERSISTENCE</text>
    <text x="18" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Data &amp; Cloud Tier</text>
    
    <path d="M18 64H186" stroke="#1E293B"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#94A3B8">
      <text x="18" y="88">✦ SQL Server (mssql)</text>
      <text x="18" y="110">✦ T-SQL Stored Procs</text>
      <text x="18" y="132">✦ Parameterized Queries</text>
      <text x="18" y="154">✦ AWS S3 / Azure MSAL</text>
      <text x="18" y="176">✦ High Transaction Scale</text>
    </g>
  </g>
</svg>
